<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 440" width="800" height="429" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="440" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">三层容器：一个 Node.js 实例的嵌套结构</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">ISOLATE ⊃ ENVIRONMENT ⊃ REALM</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="76" width="452" height="280" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="100" font-size="10.5" fill="#7a8296" letter-spacing="2.5">V8 Isolate · 独立堆 · 独立 GC · 单线程</text>

<rect x="64" y="146" width="416" height="86" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="272.0" y="193.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="80" y="168" font-size="12.5" fill="#7a8296">Environment（C++ 类）· “一个 Node.js 实例”的真身</text>
<text x="80" y="190" font-size="11" fill="#7a8296">持有：事件循环 uv_loop_t · 清理队列 · Inspector · 权限控制</text>
<text x="80" y="220" font-size="10.5" fill="#7a8296">第 4 章的心脏与退出时的按序销毁，都住在这里</text>
<rect x="82" y="250" width="380" height="78" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.2"/>
<text x="272.0" y="293.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="98" y="272" font-size="12.5" fill="#7a8296">Realm · 绑定一个 V8 Context 的执行域</text>
<text x="98" y="294" font-size="11" fill="#7a8296">process 对象住在这里 · 内置模块缓存住在这里</text>
<line x1="516" y1="80" x2="516" y2="404" stroke="#c9cfdd" stroke-width="1"/>
<text x="540" y="96" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">THE REAL SELF</text>
<text x="540" y="120" font-size="14" fill="#16213e" font-weight="800">Environment 才是真身</text>
<line x1="540" y1="132" x2="584" y2="132" stroke="#e8862e" stroke-width="3"/>
<text x="540" y="160" font-size="12.5" fill="#3d4763">事件循环 uv_loop_t（第 4 章）</text>
<text x="540" y="184" font-size="12.5" fill="#3d4763">清理队列 · 退出时按序销毁</text>
<text x="540" y="208" font-size="11.5" fill="#8b93a7">Inspector / 权限等子系统</text>
<text x="540" y="232" font-size="12.5" fill="#3d4763">Realm = Context + process</text>
<text x="540" y="256" font-size="11.5" fill="#8b93a7">        + 模块缓存</text>
<text x="540" y="280" font-size="12.5" fill="#3d4763">Worker = 线程 + Isolate</text>
<text x="540" y="304" font-size="11.5" fill="#8b93a7">        + Environment（第 14 章）</text>
<rect x="46" y="380" width="728" height="38" rx="4" fill="#f4f6fa" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="403.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">Isolate = 堆与 GC 的边界 · Environment = 实例实体 · Realm = 全局环境与 process</text>
</svg>
