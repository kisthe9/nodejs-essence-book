<line x1="270" y1="176" x2="270" y2="183" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="270" y1="226" x2="270" y2="233" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="270" y1="288" x2="270" y2="297" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="270" y1="340" x2="270" y2="347" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="492" y1="84" x2="492" y2="396" stroke="#c9cfdd" stroke-width="1"/>
<text x="516" y="96" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">BOOTSTRAP ORDER</text>
<text x="516" y="120" font-size="14" fill="#16213e" font-weight="800">引导脚本 · 严格顺序</text>
<line x1="516" y1="132" x2="560" y2="132" stroke="#e8862e" stroke-width="3"/>
<text x="516" y="160" font-size="12.5" fill="#3d4763">a. 加固内建 primordials</text>
<text x="516" y="184" font-size="12.5" fill="#3d4763">b. 搭 Binding 通道（第 3 章）</text>
<text x="516" y="208" font-size="12.5" fill="#3d4763">c. 创建 process 对象 · 挂全局</text>
<text x="516" y="232" font-size="12.5" fill="#3d4763">d. 按启动方式补配置</text>
<text x="516" y="256" font-size="11.5" fill="#8b93a7">主脚本？REPL？Worker？</text>
<text x="516" y="292" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">SNAPSHOT</text>
<text x="516" y="316" font-size="14" fill="#16213e" font-weight="800">快照 · 为什么这么快</text>
<line x1="516" y1="328" x2="560" y2="328" stroke="#e8862e" stroke-width="3"/>
<text x="516" y="356" font-size="12.5" fill="#3d4763">构建期执行引导 · 序列化堆</text>
<text x="516" y="380" font-size="12.5" fill="#3d4763">启动期反序列化 · 跳过执行</text>
<text x="516" y="404" font-size="11.5" fill="#8b93a7">空间（二进制体积）换时间</text>
<text x="70" y="424" font-size="12" fill="#7a8296">几十毫秒内完成全部装配——一半功劳归快照</text>
</svg>
