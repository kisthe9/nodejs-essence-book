<text x="92" y="160.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">1</text>
<text x="114" y="161.0" font-size="13.5" fill="#1d2740">进程级初始化<tspan fill="#7a8296" font-size="12">　每进程一次 · 参数解析 / V8 平台 / libuv</tspan></text>
<rect x="70" y="186" width="400" height="40" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<rect x="82" y="196.0" width="20" height="20" rx="3" fill="#2a3550"/>
<text x="92" y="210.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">2</text>
<text x="114" y="211.0" font-size="13.5" fill="#1d2740">创建三层容器<tspan fill="#7a8296" font-size="12">　Isolate → Environment → Realm 与 Context</tspan></text>
<rect x="70" y="236" width="400" height="52" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.4"/>
<rect x="82" y="252.0" width="20" height="20" rx="3" fill="#e8862e"/>
<text x="92" y="266.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">3</text>
<text x="114" y="260.0" font-size="13.5" font-weight="700" fill="#ffffff">执行内部引导脚本<tspan font-weight="400" fill="#c3c9d6" font-size="12">　primordials → Binding → process</tspan></text>
<text x="114" y="277.0" font-size="11" fill="#e8862e">③c：process 诞生于此 · 挂上全局</text>
<rect x="70" y="300" width="400" height="40" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
