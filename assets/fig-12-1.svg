<text x="92" y="324.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="114" y="325.0" font-size="13.5" fill="#1d2740">加载用户主模块<tspan fill="#7a8296" font-size="12">　你的 app.js · 经 CJS / ESM 加载器</tspan></text>
<rect x="70" y="350" width="400" height="40" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<rect x="82" y="360.0" width="20" height="20" rx="3" fill="#2a3550"/>
<text x="92" y="374.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">5</text>
