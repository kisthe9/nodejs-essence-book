<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="180.0" y="84" width="180" height="30" rx="3" fill="#16213e"/>
<text x="270" y="103.5" text-anchor="middle" font-size="12.5" fill="#ffffff">node app.js</text>
<line x1="270" y1="116" x2="270" y2="132" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="70" y="136" width="400" height="40" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
