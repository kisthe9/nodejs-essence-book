<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">两种复制规格：不共享，只传消息</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">WORKER THREADS VS CLUSTER</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="76" width="728" height="230" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="100" font-size="10.5" fill="#7a8296" letter-spacing="2.5">规格一 · Worker Threads · 线程级复制</text>

<text x="120" y="130" font-size="12" fill="#7a8296">主线程 A</text>
<rect x="120" y="142" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="215.0" y="164.5" text-anchor="middle" font-size="11.5" fill="#1d2740">Isolate A</text>
<rect x="120" y="186" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="215.0" y="208.5" text-anchor="middle" font-size="11.5" fill="#1d2740">Environment A</text>
<rect x="120" y="230" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="215.0" y="252.5" text-anchor="middle" font-size="11.5" fill="#1d2740">事件循环 A</text>
<text x="510" y="130" font-size="12" fill="#7a8296">Worker 线程 B</text>
<rect x="510" y="142" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="605.0" y="164.5" text-anchor="middle" font-size="11.5" fill="#1d2740">Isolate B</text>
<rect x="510" y="186" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="605.0" y="208.5" text-anchor="middle" font-size="11.5" fill="#1d2740">Environment B</text>
<rect x="510" y="230" width="190" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="605.0" y="252.5" text-anchor="middle" font-size="11.5" fill="#1d2740">事件循环 B</text>
<line x1="312" y1="196" x2="506" y2="196" stroke="#e8862e" stroke-width="1.4" fill="none" marker-end="url(#ara)"/>
<line x1="506" y1="212" x2="312" y2="212" stroke="#e8862e" stroke-width="1.4" fill="none" marker-end="url(#ara)"/>
<text x="366" y="184" font-size="11" fill="#c56a15" font-weight="700">postMessage</text>
<text x="120" y="292" font-size="11" fill="#7a8296">同一进程内：SharedArrayBuffer 是唯一真正共享的内存（需 Atomics）</text>
<rect x="46" y="326" width="728" height="190" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="350" font-size="10.5" fill="#7a8296" letter-spacing="2.5">规格二 · Cluster / child_process · 进程级复制</text>

<rect x="120" y="380" width="240" height="56" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="240.0" y="412.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">进程 1 · 完整 Node 实例</text>
<rect x="460" y="380" width="240" height="56" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="580.0" y="412.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">进程 2 · 完整 Node 实例</text>
<line x1="362" y1="400" x2="456" y2="400" stroke="#e8862e" stroke-width="1.4" fill="none" marker-end="url(#ara)"/>
<line x1="456" y1="416" x2="362" y2="416" stroke="#e8862e" stroke-width="1.4" fill="none" marker-end="url(#ara)"/>
<text x="396" y="390" font-size="11" fill="#c56a15" font-weight="700">IPC</text>
<text x="120" y="468" font-size="11" fill="#7a8296">彻底隔离：一个崩了另一个毫发无损</text>
<text x="460" y="468" font-size="11" fill="#7a8296">cluster 另借 fd 传递共享同一端口（第 6 章）</text>
</svg>
