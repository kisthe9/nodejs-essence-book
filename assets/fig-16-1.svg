<svg xmlns="http://www.w3.org/2000/svg" width="820" height="480" viewBox="0 0 820 480" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="480" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">全片回放：一个请求的一生</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">ONE REQUEST · FULL REPLAY</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="84" width="64" height="34" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="105.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">启动</text>
<rect x="122" y="84" width="652" height="34" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="105.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="105.0" font-size="11"><tspan font-weight="700" fill="#e8862e">[12]</tspan><tspan fill="#3d4763">装配线 → </tspan><tspan font-weight="700" fill="#e8862e">[11]</tspan><tspan fill="#3d4763">三层容器 → </tspan><tspan font-weight="700" fill="#e8862e">[3]</tspan><tspan fill="#3d4763">require+穿门 → </tspan><tspan font-weight="700" fill="#e8862e">[6]</tspan><tspan fill="#3d4763">listen-fd → </tspan><tspan font-weight="700" fill="#e8862e">[4]</tspan><tspan fill="#3d4763">循环入睡</tspan></text>
<rect x="46" y="136" width="64" height="34" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="157.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">连接</text>
<rect x="122" y="136" width="652" height="34" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="157.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="157.0" font-size="11"><tspan fill="#3d4763">内核握手 → </tspan><tspan font-weight="700" fill="#e8862e">[4/5]</tspan><tspan fill="#3d4763">epoll 醒 → accept 得 conn-fd</tspan><tspan font-weight="700" fill="#e8862e">[6]</tspan><tspan fill="#3d4763"> → </tspan><tspan font-weight="700" fill="#e8862e">[9]</tspan><tspan fill="#3d4763">emit('connection')</tspan></text>
<rect x="46" y="188" width="64" height="34" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="209.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">请求</text>
<rect x="122" y="188" width="652" height="34" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="209.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="209.0" font-size="11"><tspan fill="#3d4763">字节进内核缓冲 → </tspan><tspan font-weight="700" fill="#e8862e">[5]</tspan><tspan fill="#3d4763">循环 read 至 EAGAIN → </tspan><tspan font-weight="700" fill="#e8862e">[7]</tspan><tspan fill="#3d4763">零拷贝入 Buffer → </tspan><tspan font-weight="700" fill="#e8862e">[9]</tspan><tspan fill="#3d4763">emit('request')</tspan></text>
<rect x="46" y="240" width="64" height="52" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="270.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">处理</text>
<rect x="122" y="240" width="652" height="52" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="270.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="270.0" font-size="11"><tspan font-weight="700" fill="#e8862e">[5]</tspan><tspan fill="#3d4763">readFile 走线程池 · 主线程继续接客 → 完工唤醒 → </tspan><tspan font-weight="700" fill="#e8862e">[3]</tspan><tspan fill="#3d4763">MakeCallback → 你的 cb</tspan></text>
<text x="136" y="282" font-size="10.5"><tspan font-weight="700" fill="#e8862e">[15]</tspan><tspan fill="#3d4763">因果链全程随行：跨线程池、跨事件循环，上下文不丢</tspan></text>
<rect x="46" y="306" width="64" height="34" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="327.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">响应</text>
<rect x="122" y="306" width="652" height="34" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="327.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="327.0" font-size="11"><tspan fill="#3d4763">res.end → </tspan><tspan font-weight="700" fill="#e8862e">[8]</tspan><tspan fill="#3d4763">背压控流 → </tspan><tspan font-weight="700" fill="#e8862e">[6]</tspan><tspan fill="#3d4763">write(conn-fd) 多态分发 → 网卡 → 浏览器</tspan></text>
<rect x="46" y="358" width="64" height="34" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="78.0" y="379.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">退场</text>
<rect x="122" y="358" width="652" height="34" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="448.0" y="379.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="379.0" font-size="11"><tspan fill="#3d4763">SIGTERM → </tspan><tspan font-weight="700" fill="#e8862e">[12]</tspan><tspan fill="#3d4763">server.close 撤句柄 → 循环自然停 → 善终</tspan></text>
<line x1="78" y1="118" x2="78" y2="136" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="78" y1="170" x2="78" y2="188" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="78" y1="222" x2="78" y2="240" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="78" y1="292" x2="78" y2="306" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="78" y1="340" x2="78" y2="358" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="46" y="412" width="728" height="40" rx="4" fill="#f4f6fa" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="436.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="60" y="436" font-size="11"><tspan font-weight="700" fill="#e8862e">[14]</tspan><tspan fill="#3d4763">以上全部 × N 份容器 · cluster 分发连接；跨容器靠 </tspan><tspan font-weight="700" fill="#e8862e">[15]</tspan><tspan fill="#3d4763"> 的“携带 + 重新 run”接续</tspan></text>
