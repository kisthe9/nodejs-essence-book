<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 530" width="800" height="517" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="530" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">一段 JS 的一生 · 分层编译管线</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">TIERED COMPILATION</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="150" y="96" width="120" height="38" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="210.0" y="119.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">源代码</text>
<line x1="270" y1="115" x2="316" y2="115" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="320" y="96" width="120" height="38" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="380.0" y="119.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">Parser</text>
<line x1="440" y1="115" x2="486" y2="115" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="490" y="96" width="200" height="38" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="590.0" y="119.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">抽象语法树（AST）</text>
<path d="M 590 134 V 156 H 410 V 166" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="190" y="172" width="440" height="54" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="210" y="195" font-size="13" font-weight="700" fill="#1d2740">Ignition 解释器</text>
<text x="210" y="214" font-size="11.5" fill="#7a8296">字节码 · 逐条执行</text>
<line x1="410" y1="230" x2="410" y2="258" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="430" y="248" font-size="11.5" fill="#7a8296">某函数被反复调用（变“热”）</text>
<rect x="190" y="262" width="440" height="54" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="210" y="285" font-size="13" font-weight="700" fill="#1d2740">Sparkplug</text>
<text x="210" y="304" font-size="11.5" fill="#7a8296">字节码直译机器码 · 快而粗糙</text>
<line x1="410" y1="320" x2="410" y2="348" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="430" y="338" font-size="11.5" fill="#7a8296">热上加热</text>
<rect x="190" y="352" width="440" height="54" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="210" y="375" font-size="13" font-weight="700" fill="#1d2740">Maglev / TurboFan</text>
<text x="210" y="394" font-size="11.5" fill="#7a8296">逐级加深的优化机器码</text>
<line x1="410" y1="410" x2="410" y2="438" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="430" y="428" font-size="11.5" fill="#c56a15">假设失败（比如参数类型突然变了）</text>
<rect x="190" y="442" width="440" height="54" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="210" y="465" font-size="13" font-weight="700" fill="#ffffff">去优化（Deopt）</text>
<text x="210" y="484" font-size="11.5" fill="#c3c9d6">退回低级层</text>
</svg>
