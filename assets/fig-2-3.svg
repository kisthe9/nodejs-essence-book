<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">GC 暂停 · 请求时间轴</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">GC STOP-THE-WORLD</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<text x="60" y="150" font-size="12" fill="#7a8296" letter-spacing="2">时间轴</text>
<line x1="60" y1="184" x2="748" y2="184" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="96" y="162" width="130" height="44" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="161.0" y="188.5" text-anchor="middle" font-size="12" fill="#1d2740">处理请求 A</text>
<rect x="234" y="162" width="130" height="44" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="299.0" y="188.5" text-anchor="middle" font-size="12" fill="#1d2740">处理请求 B</text>
<rect x="372" y="162" width="190" height="44" rx="4" fill="#e8862e" stroke="#e8862e" stroke-width="1.2"/>
<text x="467.0" y="188.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">GC 暂停 80ms</text>
<rect x="570" y="162" width="130" height="44" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="635.0" y="188.5" text-anchor="middle" font-size="12" fill="#1d2740">处理请求 C</text>
<path d="M 467 218 L 459 232 L 475 232 Z" fill="#c56a15"/>
<text x="467" y="264" text-anchor="middle" font-size="12.5" fill="#c56a15" font-weight="700">所有排队中的请求集体多等 80ms</text>
<text x="467" y="290" text-anchor="middle" font-size="11.5" fill="#7a8296">（p99 延迟毛刺的常见来源）</text>
