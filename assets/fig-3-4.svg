<text x="380.0" y="396.5" text-anchor="middle" font-size="13" fill="#1d2740" font-weight="700">各种资源包装</text>
<text x="516" y="396.5" font-size="12" fill="#3d4763">—— TCPWrap / PipeWrap / TTYWrap / ...</text>
