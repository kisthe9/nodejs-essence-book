<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="90" y="110" width="220" height="48" rx="4" fill="#16213e" stroke="#2a3550" stroke-width="1.2"/>
<text x="200.0" y="138.5" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">BaseObject</text>
<text x="336" y="138.5" font-size="12" fill="#3d4763">—— JS/C++ 对象绑定的地基</text>
<rect x="150" y="196" width="220" height="48" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
