<rect x="0" y="0" width="820" height="460" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">BaseObject 继承链 · 统一各种资源</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">INHERITANCE CHAIN</text>
