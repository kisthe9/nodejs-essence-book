<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 550" width="800" height="537" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="550" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">两条 I/O 之路</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">TWO ROADS · ONE ASYNC</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="290.0" y="82" width="240" height="36" rx="3" fill="#16213e"/>
<text x="410" y="104.5" text-anchor="middle" font-size="12.5" fill="#ffffff">Node.js 的异步 I/O</text>
<path d="M 410 118 V 138 H 222 V 156" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 410 118 V 138 H 598 V 156" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="46" y="160" width="352" height="236" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="184" font-size="10.5" fill="#7a8296" letter-spacing="2.5">网络路 · 真异步</text>

<rect x="86" y="196" width="272" height="38" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="222.0" y="219.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">socket / pipe</text>
<line x1="222" y1="234" x2="222" y2="256" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="86" y="260" width="272" height="38" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="222.0" y="283.5" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">epoll 事件通知</text>
<text x="86" y="326" font-size="12" fill="#c56a15" font-weight="700">主线程从不为它阻塞</text>
<text x="86" y="348" font-size="11" fill="#7a8296">就绪与否是真实状态 · 内核可通知</text>
<rect x="422" y="160" width="352" height="236" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="438" y="184" font-size="10.5" fill="#7a8296" letter-spacing="2.5">文件路 · 模拟异步</text>

<rect x="462" y="196" width="272" height="38" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="598.0" y="219.5" text-anchor="middle" font-size="11.5" fill="#1d2740" font-weight="700">文件读写 · DNS 解析 · 部分加密</text>
<line x1="598" y1="234" x2="598" y2="256" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="462" y="260" width="272" height="38" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="598.0" y="283.5" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">libuv 线程池</text>
<text x="462" y="326" font-size="12" fill="#c56a15" font-weight="700">默认 4 个工人线程替主线程去阻塞</text>
<text x="462" y="348" font-size="11" fill="#7a8296">文件永远就绪 · 事件通知对它失效</text>
<path d="M 222 396 V 426 H 326 V 448" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 598 396 V 426 H 494 V 448" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="250" y="452" width="320" height="44" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="478.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">同一个 uv_run 循环 · 同一种回调风格</text>
<text x="410" y="526" text-anchor="middle" font-size="12" fill="#3d4763">底下，是两套完全不同的机制</text>
</svg>
