<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 450" width="800" height="439" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="450" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">网络路全景</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">NETWORK ROAD · EPOLL</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="96" width="190" height="40" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="141.0" y="120.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">1 万个 socket</text>
<text x="347" y="108" text-anchor="middle" font-size="11.5" fill="#7a8296">全部设为非阻塞</text>
<line x1="236" y1="116" x2="456" y2="116" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="460" y="96" width="314" height="40" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="617.0" y="120.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">全部登记进 epoll</text>
<path d="M 617 136 V 154 H 410 V 172" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="250" y="176" width="320" height="40" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="200.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">主线程在 poll 阶段调用 epoll_wait</text>
<path d="M 340 216 V 232 H 216 V 248" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<path d="M 480 216 V 232 H 595 V 248" fill="none" stroke="#2a3550" stroke-width="1.4" marker-end="url(#ar)"/>
<rect x="66" y="252" width="300" height="62" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="216.0" y="279.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2740">无事发生：阻塞</text>
<text x="216.0" y="297.0" text-anchor="middle" font-size="11" fill="#7a8296">线程休眠 · CPU 让给别人</text>
<rect x="430" y="252" width="330" height="62" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="595.0" y="279.0" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2740">N 个 fd 就绪：醒来</text>
<text x="595.0" y="297.0" text-anchor="middle" font-size="11" fill="#7a8296">逐个 read/write · 都不会卡，因为已就绪</text>
<line x1="595" y1="314" x2="595" y2="340" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="430" y="344" width="330" height="44" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="595.0" y="370.5" text-anchor="middle" font-size="12.5" fill="#ffffff" font-weight="700">MakeCallback 派发回 JS（第 4 章）</text>
<text x="410" y="424" text-anchor="middle" font-size="12.5" fill="#c56a15" font-weight="700">主线程没有为任何一个连接单独等待过 —— 等待被集中批发给了内核</text>
</svg>
