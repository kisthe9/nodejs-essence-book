<svg xmlns="http://www.w3.org/2000/svg" width="820" height="540" viewBox="0 0 820 540" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="540" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">文件路：雇四个工人替你阻塞</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">FILE ROAD · THREAD POOL</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="76" y="90" width="370" height="38" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="261.0" y="113.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">JS · fs.readFile('big.log', cb)</text>
<line x1="261" y1="128" x2="261" y2="150" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="76" y="154" width="370" height="38" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="261.0" y="177.5" text-anchor="middle" font-size="11.5" fill="#1d2740">把任务 (fd, buffer, offset) 投进任务队列</text>
<line x1="261" y1="192" x2="261" y2="214" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="76" y="218" width="370" height="128" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="92" y="242" font-size="10.5" fill="#7a8296" letter-spacing="2.5">线程池 · 默认 4 个工人线程</text>

<text x="261" y="272" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">工人取任务 → 调用阻塞的 read()</text>
<text x="261" y="296" text-anchor="middle" font-size="11.5" fill="#7a8296">实实在在地卡住 —— 卡的不是主线程</text>
<text x="277" y="372" font-size="11" fill="#7a8296">读完了</text>
<line x1="261" y1="346" x2="261" y2="388" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="76" y="392" width="370" height="52" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="261.0" y="414.0" text-anchor="middle" font-size="12" font-weight="700" fill="#1d2740">通过事件循环的唤醒机制通知主线程</text>
<text x="261.0" y="432.0" text-anchor="middle" font-size="11" fill="#7a8296">向一个内部管道写一字节 · 让 epoll_wait 醒来</text>
<line x1="261" y1="444" x2="261" y2="466" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="76" y="470" width="370" height="40" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="261.0" y="494.5" text-anchor="middle" font-size="12" fill="#ffffff" font-weight="700">主线程在下一圈循环里执行 cb(data)</text>
<text x="490" y="152" font-size="12" fill="#c56a15" font-weight="700">主线程立刻返回</text>
<text x="490" y="169" font-size="12" fill="#c56a15" font-weight="700">继续转事件循环 —— '异步'的来源</text>
<text x="490" y="262" font-size="12" fill="#c56a15" font-weight="700">阻塞没有消失</text>
<text x="490" y="279" font-size="12" fill="#c56a15" font-weight="700">只是转移了</text>
<text x="490" y="410" font-size="11" fill="#7a8296">文件路的终点，汇回网络路的</text>
<text x="490" y="427" font-size="11" fill="#7a8296">事件机制（epoll 被写醒）</text>
</svg>
