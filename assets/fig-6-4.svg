<svg xmlns="http://www.w3.org/2000/svg" width="820" height="430" viewBox="0 0 820 430" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="430" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">IPC：两个进程的 fd 指向同一个 inode</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">PIPE · SHARED INODE</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="90" width="210" height="126" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="114" font-size="10.5" fill="#7a8296" letter-spacing="2.5">进程 A · fd 表</text>

<rect x="64" y="132" width="174" height="40" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="151.0" y="156.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<rect x="72" y="142" width="20" height="20" rx="3" fill="#e8862e"/>
<text x="82" y="156.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">4</text>
<text x="102" y="157" font-size="12.5" fill="#1d2740">fd 4 · 写端</text>
<rect x="564" y="90" width="210" height="126" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="580" y="114" font-size="10.5" fill="#7a8296" letter-spacing="2.5">进程 B · fd 表</text>

<rect x="582" y="132" width="174" height="40" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="669.0" y="156.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<rect x="590" y="142" width="20" height="20" rx="3" fill="#e8862e"/>
<text x="600" y="156.5" font-size="12" font-weight="700" fill="#ffffff" text-anchor="middle">7</text>
<text x="620" y="157" font-size="12.5" fill="#1d2740">fd 7 · 读端</text>
<rect x="316" y="118" width="188" height="70" rx="4" fill="#ffffff" stroke="#e8862e" stroke-width="1.2"/>
<text x="410.0" y="157.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="410" y="146" text-anchor="middle" font-size="13.5" font-weight="700" fill="#1d2740">pipe 的 inode</text>
<text x="410" y="170" text-anchor="middle" font-size="11.5" fill="#7a8296">64KB 内核环形缓冲</text>
<line x1="256" y1="152" x2="314" y2="152" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="562" y1="152" x2="506" y2="152" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="46" y="280" width="190" height="44" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="141.0" y="306.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">A 写入字节</text>
<line x1="240" y1="302" x2="304" y2="302" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="310" y="280" width="200" height="44" rx="4" fill="#f4f6fa" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="306.5" text-anchor="middle" font-size="12.5" fill="#1d2740">内核缓冲区</text>
<line x1="514" y1="302" x2="578" y2="302" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="584" y="280" width="190" height="44" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="679.0" y="306.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">B 读出字节</text>
<text x="46" y="368" font-size="12.5" fill="#c56a15" font-weight="700">内核里没有“发消息”这回事 —— 只有共享的缓冲区</text>
<text x="46" y="392" font-size="11.5" fill="#7a8296">达成“共享同一个 inode”只有两条途径：fork 继承 与 SCM_RIGHTS 传递</text>
</svg>
