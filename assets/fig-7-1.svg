<svg xmlns="http://www.w3.org/2000/svg" width="820" height="420" viewBox="0 0 820 420" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="420" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">零拷贝解剖：同一块物理内存</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">BUFFER · BACKINGSTORE · SYSCALL</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="110" width="200" height="88" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="146.0" y="158.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="62" y="136" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">JS 视角</text>
<text x="62" y="162" font-size="13" font-weight="700" fill="#1d2740">Buffer 实例</text>
<text x="62" y="184" font-size="11.5" fill="#7a8296">（Uint8Array 的子类）</text>
<rect x="310" y="110" width="240" height="88" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="430.0" y="158.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="326" y="136" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">V8 内部</text>
<text x="326" y="162" font-size="13" font-weight="700" fill="#1d2740">ArrayBuffer</text>
<text x="326" y="184" font-size="11.5" fill="#3d4763">└ BackingStore · 裸内存的托管句柄</text>
<rect x="614" y="110" width="160" height="88" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="694.0" y="158.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="630" y="136" font-size="10.5" fill="#8b93a7" letter-spacing="2.5">物理内存</text>
<text x="630" y="162" font-size="13" font-weight="700" fill="#1d2740">一段真实的</text>
<text x="630" y="184" font-size="13" font-weight="700" fill="#1d2740">字节内存</text>
<line x1="248" y1="154" x2="308" y2="154" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="256" y="144" font-size="11" fill="#7a8296">继承自</text>
<line x1="552" y1="154" x2="612" y2="154" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="562" y="144" font-size="11" fill="#7a8296">持有</text>
<line x1="694" y1="200" x2="694" y2="258" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="46" y="262" width="728" height="64" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="410.0" y="298.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="410" y="288" text-anchor="middle" font-size="13" font-weight="700" fill="#ffffff">C++ 侧拿到 BackingStore 的裸指针 → read(fd, 该指针, len)</text>
<text x="410" y="310" text-anchor="middle" font-size="11.5" fill="#e8862e">内核直接把数据写进这块内存 · 两个世界之间零次复制</text>
<text x="46" y="356" font-size="12.5" fill="#7a8296">buf[0] 读到的字节，就是内核当初写入的那个字节 —— 同一个物理地址</text>
<text x="46" y="380" font-size="11.5" fill="#7a8296">字符串方案要三级复制：内核缓冲 → C++ 中转 → 编码转换 → V8 堆字符串</text>
</svg>
