<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 600" width="800" height="585" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="600" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">两档分配：小额找零与大额转账</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">POOL SLICE VS STANDALONE</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="250.0" y="84" width="320" height="32" rx="3" fill="#16213e"/>
<text x="410" y="104.5" text-anchor="middle" font-size="12.5" fill="#ffffff">分配请求 · Buffer.allocUnsafe(size)</text>
<line x1="410" y1="116" x2="410" y2="136" stroke="#2a3550" stroke-width="1.2"/>
<line x1="230" y1="136" x2="590" y2="136" stroke="#2a3550" stroke-width="1.2"/>
<line x1="230" y1="136" x2="230" y2="158" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="590" y1="136" x2="590" y2="158" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="90" y="162" width="280" height="44" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="230.0" y="188.5" text-anchor="middle" font-size="13" fill="#1d2740" font-weight="700">size &lt; 4KB（池的一半）</text>
<rect x="450" y="162" width="280" height="44" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="590.0" y="188.5" text-anchor="middle" font-size="13" fill="#1d2740" font-weight="700">size ≥ 4KB（达到半池）</text>
<line x1="230" y1="206" x2="230" y2="228" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<line x1="590" y1="206" x2="590" y2="228" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<rect x="90" y="232" width="280" height="60" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="230.0" y="266.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="230" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2740">从预分配的 8KB “找零池”里切一片</text>
<text x="230" y="277" text-anchor="middle" font-size="11" fill="#7a8296">复用共享池 · 快</text>
<rect x="450" y="232" width="280" height="60" rx="4" fill="#ffffff" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="590.0" y="266.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="590" y="257" text-anchor="middle" font-size="12.5" font-weight="700" fill="#1d2740">独立分配一块大小恰好的专属内存</text>
<text x="590" y="277" text-anchor="middle" font-size="11" fill="#7a8296">避免霸占找零池</text>
<rect x="46" y="320" width="470" height="200" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="62" y="344" font-size="10.5" fill="#7a8296" letter-spacing="2.5">途径一 · 8KB slab 共享切分</text>

<rect x="66" y="372" width="430" height="48" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.2"/>
<text x="281.0" y="400.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<rect x="66" y="372" width="86" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="109.0" y="400.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="109" y="400" text-anchor="middle" font-size="10.5" fill="#1d2740">切片 a · 3B</text>
<rect x="152" y="372" width="120" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="212.0" y="400.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="212" y="400" text-anchor="middle" font-size="10.5" fill="#1d2740">切片 b · 10B</text>
<rect x="272" y="372" width="224" height="48" rx="4" fill="none" stroke="#c9cfdd" stroke-width="1.2" stroke-dasharray="4 4"/>
<text x="384" y="400" text-anchor="middle" font-size="10.5" fill="#7a8296">剩余 · 装不下就换新池</text>
<line x1="66" y1="420" x2="66" y2="428" stroke="#7a8296" stroke-width="1"/>
<text x="66" y="444" font-size="10.5" fill="#7a8296">offset 0</text>
<line x1="152" y1="420" x2="152" y2="428" stroke="#7a8296" stroke-width="1"/>
<text x="152" y="444" font-size="10.5" fill="#7a8296">offset 8 · 8 字节对齐</text>
<line x1="272" y1="420" x2="272" y2="428" stroke="#7a8296" stroke-width="1"/>
<text x="272" y="444" font-size="10.5" fill="#7a8296">offset 24</text>
<text x="66" y="482" font-size="11" fill="#3d4763">多个小 Buffer 共享同一个 ArrayBuffer · 各自持有偏移量</text>
<rect x="536" y="320" width="238" height="200" rx="4" fill="#f4f6fa" stroke="#2a3550" stroke-width="1.4"/>
<text x="552" y="344" font-size="10.5" fill="#7a8296" letter-spacing="2.5">途径二 · 独立分配</text>

<rect x="556" y="372" width="198" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="655.0" y="400.5" text-anchor="middle" font-size="12" fill="#1d2740" font-weight="700">专属 ArrayBuffer</text>
<text x="655" y="444" text-anchor="middle" font-size="10.5" fill="#7a8296">大小 = 请求大小</text>
<text x="556" y="482" font-size="11" fill="#3d4763">达到半池不再进池</text>
<text x="46" y="552" font-size="12.5" fill="#c56a15" font-weight="700">半池分界是“严格小于”：alloc(4095) 还在池里 · alloc(4096) 独立分配</text>
<text x="46" y="576" font-size="11.5" fill="#7a8296">长度为 0 的分配直接返回现成的空 Buffer，不占任何内存</text>
</svg>
