<svg xmlns="http://www.w3.org/2000/svg" width="820" height="520" viewBox="0 0 820 520" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="520" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">四种流，一个家族</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">STREAM FAMILY TREE</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="60" y="88" width="200" height="40" rx="4" fill="#16213e" stroke="#16213e" stroke-width="1.2"/>
<text x="160.0" y="112.5" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">EventEmitter</text>
<text x="276" y="113" font-size="11.5" fill="#7a8296">← 所有流都是事件发射器（第 9 章）</text>
<line x1="160" y1="128" x2="160" y2="150" stroke="#2a3550" stroke-width="1.2"/>
<rect x="100" y="150" width="160" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="180.0" y="172.5" text-anchor="middle" font-size="13" fill="#1d2740" font-weight="700">Stream</text>
<line x1="180" y1="186" x2="180" y2="442" stroke="#2a3550" stroke-width="1.2"/>
<line x1="180" y1="228" x2="220" y2="228" stroke="#2a3550" stroke-width="1.2"/>
<rect x="220" y="210" width="170" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="305.0" y="232.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">Readable</text>
<text x="402" y="232" font-size="11.5" fill="#3d4763">数据的源头 · fs.createReadStream, http 请求体</text>
<line x1="180" y1="280" x2="220" y2="280" stroke="#2a3550" stroke-width="1.2"/>
<rect x="220" y="262" width="170" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="305.0" y="284.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">Writable</text>
<text x="402" y="284" font-size="11.5" fill="#3d4763">数据的去处 · fs.createWriteStream, http 响应</text>
<line x1="180" y1="332" x2="220" y2="332" stroke="#2a3550" stroke-width="1.2"/>
<rect x="220" y="314" width="170" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="305.0" y="336.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">Duplex</text>
<text x="402" y="336" font-size="11.5" fill="#3d4763">既是源又是去处 · net.Socket（双向、两套独立缓冲）</text>
<line x1="180" y1="442" x2="220" y2="442" stroke="#2a3550" stroke-width="1.2"/>
<rect x="220" y="424" width="170" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="305.0" y="446.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">(PassThrough)</text>
<text x="402" y="446" font-size="11.5" fill="#3d4763">什么都不做的 Transform · 常用于观测/计数</text>
<line x1="305" y1="350" x2="305" y2="370" stroke="#2a3550" stroke-width="1.2"/>
<rect x="280" y="370" width="170" height="36" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="365.0" y="392.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">Transform</text>
<text x="462" y="392" font-size="11.5" fill="#3d4763">中途加工站 · zlib.createGzip, crypto 流</text>
<text x="60" y="492" font-size="12" fill="#7a8296">Duplex 内部是两套互不相干的缓冲区；Transform 用加工函数把两套缓冲打通</text>
</svg>
