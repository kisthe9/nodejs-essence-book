<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 820 460" width="800" height="449" font-family="'Source Han Sans SC','Noto Sans CJK SC',sans-serif">
<defs>
<marker id="ar" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#2a3550" stroke-width="1.5"/></marker>
<marker id="ara" markerWidth="10" markerHeight="10" refX="8" refY="4" orient="auto"><path d="M1,1 L8,4 L1,7" fill="none" stroke="#e8862e" stroke-width="1.5"/></marker>
</defs>
<rect x="0" y="0" width="820" height="460" fill="#ffffff"/>
<text x="46" y="40" font-size="18" fill="#16213e" font-weight="800" letter-spacing="1">背压：pipe 的自动刹车闭环</text>
<text x="774" y="40" text-anchor="end" font-size="10.5" fill="#8b93a7" letter-spacing="3">BACKPRESSURE · WRITE / DRAIN</text>
<line x1="46" y1="54" x2="774" y2="54" stroke="#16213e" stroke-width="2"/>
<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="150" width="180" height="70" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="136.0" y="189.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="136" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2740">readable · 生产者</text>
<text x="136" y="202" text-anchor="middle" font-size="11" fill="#7a8296">快（磁盘读）</text>
<rect x="330" y="110" width="180" height="170" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="420.0" y="199.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<rect x="331.5" y="170" width="177" height="108.5" fill="#f4f6fa"/>
<line x1="330" y1="170" x2="510" y2="170" stroke="#e8862e" stroke-width="1.4" stroke-dasharray="5 4"/>
<text x="336" y="162" font-size="10.5" fill="#c56a15" font-weight="700">highWaterMark · 水位线</text>
<rect x="346" y="246" width="40" height="18" rx="3" fill="#ffffff" stroke="#2a3550" stroke-width="1"/>
<rect x="392" y="246" width="40" height="18" rx="3" fill="#ffffff" stroke="#2a3550" stroke-width="1"/>
<rect x="438" y="246" width="40" height="18" rx="3" fill="#ffffff" stroke="#2a3550" stroke-width="1"/>
<text x="420" y="300" text-anchor="middle" font-size="11" fill="#7a8296">writable 内部缓冲</text>
<rect x="610" y="150" width="164" height="70" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="692.0" y="189.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="692" y="180" text-anchor="middle" font-size="13" font-weight="700" fill="#1d2740">writable · 消费者</text>
<text x="692" y="202" text-anchor="middle" font-size="11" fill="#7a8296">慢（网络发）</text>
<line x1="226" y1="185" x2="328" y2="185" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="252" y="176" font-size="11" fill="#3d4763">data</text>
<text x="232" y="206" font-size="11" fill="#3d4763">write(chunk)</text>
<line x1="510" y1="240" x2="608" y2="240" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
<text x="520" y="232" font-size="11" fill="#3d4763">消费 · 慢</text>
<path d="M 420 110 V 88 H 136 V 146" fill="none" stroke="#e8862e" stroke-width="2" marker-end="url(#ara)"/>
<text x="150" y="80" font-size="11.5" fill="#c56a15" font-weight="700">write(chunk) 返回 false → readable.pause() · 上游停读</text>
<path d="M 480 280 V 332 H 136 V 224" fill="none" stroke="#e8862e" stroke-width="2" marker-end="url(#ara)"/>
<text x="150" y="352" font-size="11.5" fill="#c56a15" font-weight="700">缓冲排空后发 'drain' → readable.resume() · 恢复</text>
<text x="46" y="398" font-size="12" fill="#7a8296">false 不是拒收：数据照单全收，缓冲可以涨过水位线（没有硬上限）</text>
<text x="46" y="422" font-size="12" fill="#7a8296">无视 false 是 Stream OOM 的头号原因；pipe / pipeline 替你接好这个闭环</text>
</svg>
