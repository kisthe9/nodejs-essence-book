<line x1="46" y1="58.5" x2="774" y2="58.5" stroke="#c9cfdd" stroke-width="0.8"/>

<rect x="46" y="110" width="222" height="52" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="157.0" y="140.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">内核 · fd 就绪</text>
<line x1="268" y1="136" x2="298" y2="136" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
