<text x="411.0" y="140.5" text-anchor="middle" font-size="12.5" fill="#1d2740">epoll_wait 返回</text>
<line x1="522" y1="136" x2="552" y2="136" stroke="#2a3550" stroke-width="1.4" fill="none" marker-end="url(#ar)"/>
