<path d="M 386 268 L 394 282 L 378 282 Z" fill="#e8862e"/>
<text x="250" y="306" font-size="12.5" fill="#c56a15" font-weight="700">异步性来自这里 —— 事件循环决定何时触发</text>
<text x="250" y="330" font-size="12" fill="#7a8296">emit 本身只是同步分发：for 循环调用监听器</text>
<rect x="46" y="362" width="728" height="44" rx="4" fill="#f4f6fa" stroke="#c9cfdd" stroke-width="1.2"/>
<text x="410.0" y="388.5" text-anchor="middle" font-size="12.5" fill="#1d2740" font-weight="700">何时触发 = 异步（事件循环掌管） · 如何分发 = 同步（for 循环）</text>
