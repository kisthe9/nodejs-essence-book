<text x="510" y="508" font-size="11.5" fill="#3d4763">'beforeExit' 'SIGINT' 'uncaughtException'</text>
<text x="46" y="550" font-size="12" fill="#7a8296">I/O 对象的一生 = 多种、多次、不定时的事情 —— EventEmitter 是最小完备接口</text>
