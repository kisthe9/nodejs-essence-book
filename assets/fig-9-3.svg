<text x="206" y="332" font-size="10.5" fill="#7a8296">继承 net.Server</text>
<text x="510" y="322" font-size="11.5" fill="#3d4763">'request' 'upgrade'</text>
<line x1="146" y1="380" x2="190" y2="380" stroke="#2a3550" stroke-width="1.2"/>
<rect x="190" y="356" width="300" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="340.0" y="384.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="206" y="377" font-size="12.5" font-weight="700" fill="#1d2740">ChildProcess</text>
