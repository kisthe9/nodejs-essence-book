<text x="206" y="253" font-size="12.5" font-weight="700" fill="#1d2740">net.Server / net.Socket</text>
<text x="206" y="270" font-size="10.5" fill="#7a8296">服务器与连接对象</text>
<text x="510" y="260" font-size="11.5" fill="#3d4763">'connection' 'data' 'close'</text>
<line x1="146" y1="318" x2="190" y2="318" stroke="#2a3550" stroke-width="1.2"/>
<rect x="190" y="294" width="300" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
