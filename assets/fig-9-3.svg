<text x="206" y="191" font-size="12.5" font-weight="700" fill="#1d2740">Stream 家族</text>
<text x="206" y="208" font-size="10.5" fill="#7a8296">Readable · Writable · Duplex · Transform</text>
<text x="510" y="198" font-size="11.5" fill="#3d4763">'data' 'end' 'drain' 'error'</text>
