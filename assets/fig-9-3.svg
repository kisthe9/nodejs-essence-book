<text x="206" y="439" font-size="12.5" font-weight="700" fill="#1d2740">Worker</text>
<text x="206" y="456" font-size="10.5" fill="#7a8296">worker_threads</text>
<text x="510" y="446" font-size="11.5" fill="#3d4763">'message' 'exit'</text>
<line x1="146" y1="504" x2="190" y2="504" stroke="#2a3550" stroke-width="1.2"/>
<rect x="190" y="480" width="300" height="48" rx="4" fill="#ffffff" stroke="#2a3550" stroke-width="1.2"/>
<text x="340.0" y="508.5" text-anchor="middle" font-size="12" fill="#1d2740"></text>
<text x="206" y="501" font-size="12.5" font-weight="700" fill="#1d2740">process 对象本身</text>
