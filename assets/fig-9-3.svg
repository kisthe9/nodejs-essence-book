<text x="146.0" y="118.5" text-anchor="middle" font-size="13" fill="#ffffff" font-weight="700">EventEmitter</text>
<line x1="146" y1="136" x2="146" y2="504" stroke="#2a3550" stroke-width="1.2"/>
<line x1="146" y1="194" x2="190" y2="194" stroke="#2a3550" stroke-width="1.2"/>
